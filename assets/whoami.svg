<text x="31" y="114" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="24" fill="#2C2A22">WHO IS DHANUSH?</text>
<text x="535" y="162" font-family="Verdana, sans-serif" font-size="14.5" fill="#2C2A22">Third-year EEE student who taught</text>
<text x="535" y="184" font-family="Verdana, sans-serif" font-size="14.5" fill="#2C2A22">himself to code because curiosity</text>
<text x="535" y="206" font-family="Verdana, sans-serif" font-size="14.5" fill="#2C2A22">does not wait for a syllabus.</text>
<text x="535" y="228" font-family="Verdana, sans-serif" font-size="14.5" fill="#2C2A22"></text>
<text x="535" y="250" font-family="Verdana, sans-serif" font-size="14.5" fill="#2C2A22">Co-founder &amp; CPTO at Hadhaan</text>
<text x="535" y="272" font-family="Verdana, sans-serif" font-size="14.5" fill="#2C2A22">Technologies. Handles all product</text>
<text x="535" y="294" font-family="Verdana, sans-serif" font-size="14.5" fill="#2C2A22">and tech; runs on probability,</text>
<text x="535" y="316" font-family="Verdana, sans-serif" font-size="14.5" fill="#2C2A22">patterns, and cold coffee.</text>
<text x="535" y="338" font-family="Verdana, sans-serif" font-size="14.5" fill="#2C2A22"></text>
<text x="535" y="360" font-family="Verdana, sans-serif" font-size="14.5" fill="#2C2A22">Believes understanding how a</text>
<text x="535" y="382" font-family="Verdana, sans-serif" font-size="14.5" fill="#2C2A22">system breaks is half of</text>
<text x="535" y="404" font-family="Verdana, sans-serif" font-size="14.5" fill="#2C2A22">understanding how it works.</text>
